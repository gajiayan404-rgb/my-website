<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Ayan Gaji | Developer & Admin Portal. Secure Glassmorphic Authentication & Biometric Access System." />
  <title>Developer Access Portal — Ayan Gaji | AYAN.DEV</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Remix Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0A0D14;
      --bg-dark-secondary: #101522;
      --bg-card: rgba(16, 21, 34, 0.75);
      --bg-card-hover: rgba(22, 29, 46, 0.85);
      
      --accent-cyan: #00F0FF;
      --accent-purple: #9D4EDD;
      --accent-gold: #FFB703;
      --accent-green: #06D6A0;
      --accent-primary: #00F0FF;
      --accent-gradient: linear-gradient(135deg, #00F0FF 0%, #7928CA 50%, #FF0080 100%);
      --accent-glow: 0 0 25px rgba(0, 240, 255, 0.35);

      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;

      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-focus: rgba(0, 240, 255, 0.6);
      --glass-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 240, 255, 0.1);

      --font-family: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-code: 'Fira Code', monospace;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Ambient Animated Mesh Background */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-orbs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #00F0FF 0%, rgba(0, 240, 255, 0) 70%);
      top: -10%;
      left: -10%;
    }

    .orb-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #7928CA 0%, rgba(121, 40, 202, 0) 70%);
      bottom: -15%;
      right: -10%;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, #FF0080 0%, rgba(255, 0, 128, 0) 70%);
      top: 40%;
      right: 25%;
      animation-delay: -3s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    /* Portal Container */
    .portal-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      perspective: 1200px;
    }

    /* Top Back Navigation */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      transform: translateX(-4px);
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-family: var(--font-code);
      color: var(--accent-green);
      background: rgba(6, 214, 160, 0.1);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(6, 214, 160, 0.25);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* 3D Glass Login Card */
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent-gradient);
    }

    .card-hologram-glow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.18) 0%, rgba(0, 240, 255, 0) 70%);
      pointer-events: none;
    }

    /* Card Header */
    .card-header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .avatar-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 240, 255, 0.5);
      animation: spinRing 14s linear infinite;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .portal-title {
      font-family: var(--font-heading);
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .portal-title .highlight {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .portal-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Mode Switcher Tabs */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 26px;
      gap: 4px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      font-size: 1.15rem;
      transition: color 0.3s ease;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: rgba(10, 13, 20, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 13px 44px 13px 42px;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.05);
      background: rgba(10, 13, 20, 0.85);
    }

    .form-input:focus + .input-icon,
    .form-input:focus ~ .input-icon {
      color: var(--accent-cyan);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .toggle-pwd-btn:hover {
      color: var(--text-main);
    }

    /* Biometric Scan Container */
    .biometric-panel {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .biometric-panel.active {
      display: block;
    }

    .fingerprint-btn {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.05);
      border: 2px solid rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }

    .fingerprint-btn i {
      font-size: 3.2rem;
      color: var(--accent-cyan);
      transition: transform 0.3s ease;
    }

    .fingerprint-btn:hover {
      transform: scale(1.05);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
    }

    .scan-beam {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #00F0FF;
      box-shadow: 0 0 15px #00F0FF;
      opacity: 0;
    }

    .fingerprint-btn.scanning .scan-beam {
      opacity: 1;
      animation: scanLaser 1.5s infinite ease-in-out;
    }

    @keyframes scanLaser {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    .biometric-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Quick Demo Login Pill */
    .quick-demo-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.82rem;
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .demo-fill-btn {
      background: rgba(255, 183, 3, 0.1);
      border: 1px solid rgba(255, 183, 3, 0.3);
      color: var(--accent-gold);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-family: var(--font-code);
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .demo-fill-btn:hover {
      background: rgba(255, 183, 3, 0.2);
      transform: translateY(-1px);
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      color: #FFFFFF;
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 240, 255, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn.loading {
      pointer-events: none;
      opacity: 0.85;
    }

    .submit-btn.loading i {
      animation: spinIcon 1s linear infinite;
    }

    @keyframes spinIcon {
      100% { transform: rotate(360deg); }
    }

    /* Toast Notification */
    .toast-msg {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .toast-msg.success {
      display: flex;
      background: rgba(6, 214, 160, 0.12);
      border: 1px solid rgba(6, 214, 160, 0.4);
      color: #06D6A0;
    }

    .toast-msg.error {
      display: flex;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #EF4444;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Security Encryption Footer */
    .card-footer {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-dim);
      font-family: var(--font-code);
    }

    .security-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-cyan);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Animated Ambient Orbs -->
  <div class="ambient-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Interactive 3D Canvas -->
  <canvas id="login-canvas" class="bg-canvas"></canvas>

  <div class="portal-container" id="portal-container">
    
    <!-- Top Navigation -->
    <div class="top-nav">
      <a href="index.html" class="back-btn">
        <i class="ri-arrow-left-line"></i> Back to Portfolio
      </a>
      <div class="live-status">
        <span class="live-dot"></span>
        <span>SYSTEM SECURE</span>
      </div>
    </div>

    <!-- 3D Glass Login Card -->
    <div class="login-card" id="login-card">
      <div class="card-hologram-glow"></div>

      <!-- Card Header -->
      <div class="card-header">
        <div class="avatar-wrapper">
          <div class="avatar-ring"></div>
          <img src="profile.jpg" alt="Ayan Gaji" class="avatar-img" />
        </div>
        <h1 class="portal-title">AYAN<span class="highlight">.DEV</span></h1>
        <p class="portal-subtitle"><i class="ri-shield-keyhole-line"></i> Developer & Admin Access Portal</p>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-password" onclick="switchAuthMode('password')">
          <i class="ri-lock-password-line"></i> Password
        </button>
        <button class="tab-btn" id="tab-biometric" onclick="switchAuthMode('biometric')">
          <i class="ri-fingerprint-line"></i> Biometric PIN
        </button>
      </div>

      <!-- Standard Password Form -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div id="password-fields">
          <div class="form-group">
            <label class="form-label">Username / Developer ID</label>
            <div class="input-wrapper">
              <input type="text" id="username" class="form-input" placeholder="e.g. ayan or admin" required autocomplete="username" />
              <i class="ri-user-6-line input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <div class="form-label">
              <span>Security Key / Password</span>
              <a href="#" onclick="fillDemo(event)" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.78rem;">Need Key?</a>
            </div>
            <div class="input-wrapper">
              <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password" />
              <i class="ri-shield-flash-line input-icon"></i>
              <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <i class="ri-eye-line" id="pwd-icon"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Biometric Scanner View -->
        <div class="biometric-panel" id="biometric-panel">
          <div class="fingerprint-btn" id="fingerprint-btn" onclick="triggerBiometricScan()">
            <div class="scan-beam"></div>
            <i class="ri-fingerprint-fill"></i>
          </div>
          <p class="biometric-hint" id="biometric-status">Click fingerprint icon to scan biometric key</p>
        </div>

        <!-- Quick Demo Pill -->
        <div class="quick-demo-row">
          <label class="remember-wrap">
            <input type="checkbox" id="remember-me" checked />
            <span>Keep session active</span>
          </label>
          <button type="button" class="demo-fill-btn" onclick="fillDemo(event)" title="Auto-fill Demo Credentials">
            <i class="ri-flashlight-line"></i> Quick Demo Fill
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submit-btn">
          <i class="ri-login-circle-fill"></i>
          <span id="btn-text">Authenticate Session</span>
        </button>

        <!-- Toast Feedback -->
        <div class="toast-msg" id="toast-msg">
          <i class="ri-checkbox-circle-fill" id="toast-icon"></i>
          <span id="toast-text">Authentication successful. Initializing...</span>
        </div>
      </form>

      <!-- Security Status Footer -->
      <div class="card-footer">
        <div class="security-badge">
          <i class="ri-lock-2-line"></i>
          <span>TLS 1.3 • AES-256</span>
        </div>
        <span>REST API: SQLite 3</span>
      </div>
    </div>
  </div>

  <!-- Interactive 3D Physics and Form Authentication Logic -->
  <script>
    // 3D Card Tilt Physics
    const card = document.getElementById('login-card');
    const container = document.getElementById('portal-container');

    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = (e.clientX - innerWidth / 2) / 35;
      const y = (e.clientY - innerHeight / 2) / 35;
      card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const pwdIcon = document.getElementById('pwd-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdIcon.className = 'ri-eye-off-line';
      } else {
        pwdInput.type = 'password';
        pwdIcon.className = 'ri-eye-line';
      }
    }

    // Switch Tabs: Password vs Biometric
    function switchAuthMode(mode) {
      const tabPassword = document.getElementById('tab-password');
      const tabBiometric = document.getElementById('tab-biometric');
      const passwordFields = document.getElementById('password-fields');
      const biometricPanel = document.getElementById('biometric-panel');

      if (mode === 'password') {
        tabPassword.classList.add('active');
        tabBiometric.classList.remove('active');
        passwordFields.style.display = 'block';
        biometricPanel.classList.remove('active');
      } else {
        tabBiometric.classList.add('active');
        tabPassword.classList.remove('active');
        passwordFields.style.display = 'none';
        biometricPanel.classList.add('active');
      }
    }

    // Auto-fill Demo Credentials
    function fillDemo(e) {
      if (e) e.preventDefault();
      switchAuthMode('password');
      document.getElementById('username').value = 'ayan';
      document.getElementById('password').value = 'admin123';
      showToast('Demo credentials auto-filled (ayan / admin123)', 'success');
    }

    // Biometric Scanner Simulation
    function triggerBiometricScan() {
      const btn = document.getElementById('fingerprint-btn');
      const status = document.getElementById('biometric-status');
      btn.classList.add('scanning');
      status.textContent = '⚡ Scanning cryptographic fingerprint...';
      status.style.color = 'var(--accent-cyan)';

      setTimeout(() => {
        btn.classList.remove('scanning');
        status.textContent = '✅ Biometric Key Verified: Developer Ayan Gaji';
        status.style.color = 'var(--accent-green)';
        
        // Auto authenticate
        setTimeout(() => {
          completeAuthentication('Ayan Gaji (Biometric)');
        }, 800);
      }, 1600);
    }

    // Handle Form Submit
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      submitBtn.classList.add('loading');
      btnText.textContent = 'Verifying API Credentials...';

      // Call Backend REST API if available
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          completeAuthentication(data.user || username);
          return;
        }
      } catch (err) {
        // Fallback for static hosting / GitHub Pages
        console.log('Using static client authentication fallback');
      }

      // Static fallback credentials validation
      if ((username.toLowerCase() === 'ayan' || username.toLowerCase() === 'admin') && (password === 'admin123' || password === 'ayan123' || password.length >= 4)) {
        setTimeout(() => {
          completeAuthentication(username);
        }, 800);
      } else {
        setTimeout(() => {
          submitBtn.classList.remove('loading');
          btnText.textContent = 'Authenticate Session';
          showToast('Invalid credentials! Try ayan / admin123 or click Quick Demo Fill.', 'error');
        }, 600);
      }
    }

    // Success Authentication
    function completeAuthentication(user) {
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      
      // Save session state in localStorage
      localStorage.setItem('ayan_auth_session', JSON.stringify({
        authenticated: true,
        user: user,
        role: 'Administrator',
        timestamp: new Date().toISOString()
      }));

      showToast(`Welcome back, ${user}! Session Authorized.`, 'success');
      submitBtn.style.background = 'linear-gradient(135deg, #06D6A0 0%, #00F0FF 100%)';
      btnText.textContent = 'Access Granted ⚡';

      setTimeout(() => {
        window.location.href = 'index.html?auth=true';
      }, 1200);
    }

    // Toast Messenger
    function showToast(message, type) {
      const toast = document.getElementById('toast-msg');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-text');

      toast.className = `toast-msg ${type}`;
      icon.className = type === 'success' ? 'ri-checkbox-circle-fill' : 'ri-error-warning-fill';
      text.textContent = message;
      toast.style.display = 'flex';
    }

    // Interactive Particle Background
    const canvas = document.getElementById('login-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.speedY = (Math.random() - 0.5) * 0.8;
        this.color = Math.random() > 0.5 ? 'rgba(0, 240, 255, 0.4)' : 'rgba(157, 78, 221, 0.4)';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 110) {
            ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 110)})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
